[project]
name = "cli-agent-orchestrator-server"
version = "0.0.1"
description = "CLI Agent Orchestrator (CAO) example server for the AG-UI Dojo (keyless mock_cli fleet)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The AG-UI run plane lives in CAO's services.agui module (the [agui] extra
    # pulls ag-ui-protocol). AG-UI Phase 2 (the L2 constructs + POST /agui/v1/run,
    # awslabs/cli-agent-orchestrator#458 / #485) is not yet on PyPI — 2.3.0
    # predates it and ships no services/agui — so we pin the exact awslabs commit
    # that introduced it. Deterministic, keyless, canonical, and still standalone:
    # a pinned VCS dependency, not a local source checkout. Swap to a published
    # release (e.g. >=2.4.0) once Phase 2 is released to PyPI.
    "cli-agent-orchestrator[agui] @ git+https://github.com/awslabs/cli-agent-orchestrator.git@edf61cad65a8183d37466f2d112d19a365cfca5c",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
dev = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the pinned VCS dependency above (git+https://…@<sha>) is accepted.
# Remove once CAO's AG-UI Phase 2 is on PyPI and the pin becomes a plain version.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
